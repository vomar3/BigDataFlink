services:
  postgres:
    image: postgres:16
    container_name: bigdata-postgres
    environment:
      POSTGRES_DB: bigdata
      POSTGRES_USER: flink
      POSTGRES_PASSWORD: flink
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flink -d bigdata"]
      interval: 5s
      timeout: 5s
      retries: 20

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: bigdata-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: bigdata-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 4
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20

  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: bigdata-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - bash
      - -c
      - |
        kafka-topics --bootstrap-server kafka:29092 \
          --create --if-not-exists \
          --topic mock_data \
          --partitions 4 \
          --replication-factor 1

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: bigdata-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      LOGGING_LEVEL_ROOT: WARN
      LOGGING_LEVEL_COM_PROVECTUS: WARN

  jobmanager:
    build:
      context: ./flink
    image: bigdata-pyflink-jobmanager:1.19.1
    container_name: bigdata-flink-jobmanager
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        parallelism.default: 4
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: mock_data
      POSTGRES_URL: jdbc:postgresql://postgres:5432/bigdata
      POSTGRES_USER: flink
      POSTGRES_PASSWORD: flink
    volumes:
      - ./flink_job:/opt/flink/usrlib:ro

  taskmanager:
    build:
      context: ./flink
    image: bigdata-pyflink-taskmanager:1.19.1
    container_name: bigdata-flink-taskmanager
    depends_on:
      - jobmanager
    command: taskmanager
    scale: 1
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 4
        parallelism.default: 4
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: mock_data
      POSTGRES_URL: jdbc:postgresql://postgres:5432/bigdata
      POSTGRES_USER: flink
      POSTGRES_PASSWORD: flink
    volumes:
      - ./flink_job:/opt/flink/usrlib:ro

  flink-job:
    build:
      context: ./flink
    image: bigdata-pyflink-submit:1.19.1
    container_name: bigdata-flink-job-submit
    depends_on:
      jobmanager:
        condition: service_started
      taskmanager:
        condition: service_started
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: mock_data
      POSTGRES_URL: jdbc:postgresql://postgres:5432/bigdata
      POSTGRES_USER: flink
      POSTGRES_PASSWORD: flink
    volumes:
      - ./flink_job:/opt/flink/usrlib:ro
    command:
      - bash
      - -c
      - |
        until flink list -m jobmanager:8081 >/dev/null 2>&1; do
          echo "Waiting for Flink JobManager..."
          sleep 2
        done
        flink run -d -m jobmanager:8081 -py /opt/flink/usrlib/star_schema_job.py

  producer:
    build:
      context: ./producer
    container_name: bigdata-producer
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      flink-job:
        condition: service_started
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: mock_data
      CSV_DATA_DIR: /data
      KEY_MODE: none
      PYTHONUNBUFFERED: 1
    volumes:
      - ./:/data:ro
    command: ["python", "/app/csv_to_kafka.py"]

  verifier:
    image: postgres:16
    container_name: bigdata-verifier
    depends_on:
      producer:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: flink
    command:
      - bash
      - -c
      - |
        echo "Waiting for Flink to write 10000 fact rows..."
        for i in {1..60}; do
          count=$$(psql -h postgres -U flink -d bigdata -tAc "SELECT COUNT(*) FROM fact_sales;")
          echo "fact_sales rows: $$count"
          if [ "$$count" = "10000" ]; then
            break
          fi
          sleep 5
        done

        count=$$(psql -h postgres -U flink -d bigdata -tAc "SELECT COUNT(*) FROM fact_sales;")
        if [ "$$count" != "10000" ]; then
          echo "ERROR: expected 10000 rows in fact_sales, got $$count"
          exit 1
        fi

        echo ""
        echo "=== STAR SCHEMA COUNTS ==="
        psql -h postgres -U flink -d bigdata -c "
          SELECT 'fact_sales' AS table_name, COUNT(*) FROM fact_sales
          UNION ALL SELECT 'dim_customer', COUNT(*) FROM dim_customer
          UNION ALL SELECT 'dim_seller', COUNT(*) FROM dim_seller
          UNION ALL SELECT 'dim_product', COUNT(*) FROM dim_product
          UNION ALL SELECT 'dim_store', COUNT(*) FROM dim_store
          UNION ALL SELECT 'dim_supplier', COUNT(*) FROM dim_supplier
          ORDER BY table_name;
        "

        echo ""
        echo "=== STAR SCHEMA JOIN SAMPLE ==="
        psql -h postgres -U flink -d bigdata -c "
          SELECT
              f.sale_id,
              f.sale_date,
              c.first_name AS customer_name,
              p.product_name,
              s.store_name,
              f.sale_quantity,
              f.sale_total_price
          FROM fact_sales f
          JOIN dim_customer c ON c.customer_id = f.customer_id
          JOIN dim_product p ON p.product_id = f.product_id
          JOIN dim_store s ON s.store_id = f.store_id
          ORDER BY f.sale_id
          LIMIT 10;
        "

        echo ""
        echo "LAB RESULT: SUCCESS. CSV -> JSON -> Kafka -> Flink -> PostgreSQL star schema is complete."

volumes:
  postgres-data:
